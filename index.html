<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maid Cat Desktop</title>
  <style>
    :root {
      --pet-w: 192px;
      --pet-h: 208px;
      --pet-scale: 1.56;
      --bubble: rgba(255, 255, 255, 0.94);
      --ink: rgba(255, 255, 255, 0.96);
      --shadow: 0 26px 60px rgba(0, 0, 0, 0.22);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
      background: #000;
    }

    .desktop {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: var(--ink);
    }

    .wallpaper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .chooser {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: rgba(6, 14, 26, 0.20);
      backdrop-filter: blur(3px);
    }

    .chooser.hidden { display: none; }

    .chooser-card {
      width: min(560px, calc(100vw - 32px));
      padding: 24px;
      border-radius: 22px;
      background: rgba(10, 16, 26, 0.74);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.28);
    }

    .chooser-note {
      margin: 0 0 16px;
      color: rgba(255, 255, 255, 0.88);
      font-size: 15px;
      line-height: 1.55;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .choice {
      border: 0;
      border-radius: 18px;
      padding: 18px 16px;
      background: rgba(255, 255, 255, 0.10);
      color: #fff;
      cursor: pointer;
      text-align: left;
      transition: transform 160ms ease, background 160ms ease;
    }

    .choice:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.16); }
    .choice strong { display: block; font-size: 18px; line-height: 1.2; margin-bottom: 8px; }
    .choice span { display: block; color: rgba(255, 255, 255, 0.78); font-size: 13px; line-height: 1.45; }

    .hud {
      position: absolute;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      z-index: 8;
      display: none;
      gap: 8px;
      align-items: center;
      flex-direction: column;
      width: min(640px, calc(100vw - 32px));
    }

    .hud.show { display: flex; }

    .counter,
    .prompt {
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(20, 24, 28, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.3;
      text-align: center;
    }

    .prompt { max-width: min(640px, calc(100vw - 32px)); }

    .pet-zone {
      position: absolute;
      left: 50%;
      bottom: 92px;
      width: calc(var(--pet-w) * var(--pet-scale));
      height: calc(var(--pet-h) * var(--pet-scale));
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      z-index: 5;
    }

    .pet-shell {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--pet-w);
      height: var(--pet-h);
      transform: translate(-50%, -50%) scale(var(--pet-scale));
      transform-origin: center;
      filter: drop-shadow(0 18px 18px rgba(0, 0, 0, 0.22));
    }

    .pet-shell.react {
      animation: petPulse 1700ms cubic-bezier(.2,.9,.2,1) forwards;
    }

    @keyframes petPulse {
      0%   { transform: translate(-50%, -50%) scale(var(--pet-scale)); }
      25%  { transform: translate(-50%, calc(-50% - 12px)) scale(1.69); }
      62%  { transform: translate(-50%, calc(-50% - 8px)) scale(1.63); }
      100% { transform: translate(-50%, -50%) scale(var(--pet-scale)); }
    }

    .sprite {
      position: absolute;
      inset: 0;
      width: var(--pet-w);
      height: var(--pet-h);
      background-image: url("assets/spritesheet.webp");
      background-repeat: no-repeat;
      background-size: 1536px 2288px;
      image-rendering: auto;
    }

    .pet-button {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 176px;
      height: 176px;
      transform: translate(-50%, -50%);
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      z-index: 6;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .bubble {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 12px);
      transform: translateX(-50%) translateY(10px) scale(0.94);
      min-width: 88px;
      max-width: 340px;
      padding: 9px 14px;
      border-radius: 18px;
      background: var(--bubble);
      color: #2f2a27;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0, 0, 0, 0.08);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      z-index: 7;
    }

    .bubble::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -7px;
      width: 14px;
      height: 14px;
      background: var(--bubble);
      border-right: 1px solid rgba(0, 0, 0, 0.08);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      transform: translateX(-50%) rotate(45deg);
    }

    .bubble.show {
      animation: bubbleIn 2400ms ease forwards;
    }

    @keyframes bubbleIn {
      0%   { opacity: 0; transform: translateX(-50%) translateY(12px) scale(0.78); }
      12%  { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      82%  { opacity: 1; transform: translateX(-50%) translateY(-8px) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-18px) scale(0.96); }
    }

    .food {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 6;
      width: 176px;
      height: 128px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: grab;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      display: none;
    }

    .food:active { cursor: grabbing; }
    .food.dragging .food-bob { animation: none; transform: translateY(0) scale(1.02); }

    .food-bob {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      animation: shrimpBob 1.65s ease-in-out infinite;
      transform-origin: center;
    }

    .food-tip {
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.96);
      color: #2f2a27;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0, 0, 0, 0.08);
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      position: relative;
    }

    .food-tip::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      width: 12px;
      height: 12px;
      background: rgba(255, 255, 255, 0.96);
      border-right: 1px solid rgba(0, 0, 0, 0.08);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      transform: translateX(-50%) rotate(45deg);
    }

    @keyframes shrimpBob {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-8px) rotate(0deg); }
    }

    .shrimp-svg {
      width: 94px;
      height: 72px;
      display: block;
      filter: drop-shadow(0 7px 10px rgba(0, 0, 0, 0.18));
    }

    .spark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.96);
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      z-index: 8;
    }

    @keyframes sparkFloat {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      15%  { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.15); }
    }

    .pet-hit {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 176px;
      height: 176px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      .chooser-card { padding: 18px; }
      .choice-grid { grid-template-columns: 1fr; }
      .hud { top: 12px; }
      .pet-zone { bottom: 86px; transform: translateX(-50%) scale(0.92); }
      .food { width: 160px; height: 118px; }
    }
  </style>
</head>
<body>
  <div class="desktop">
    <img class="wallpaper" src="assets/win7-desktop.png" alt="" aria-hidden="true" />

    <div class="chooser" id="chooser">
      <div class="chooser-card">
        <p class="chooser-note" id="chooserNote">请选择一种进行体验。完成后会出现结束提示，请再选择另外一种体验。你可以重复体验，但请确保两种都体验到。</p>
        <div class="choice-grid">
          <button class="choice" id="feedChoice">
            <strong>试试玩小游戏！</strong>
            <span>把虾拖到猫咪身上，完成 4 次喂食。</span>
          </button>
          <button class="choice" id="statusChoice">
            <strong>试试感知工作状态！</strong>
            <span>连续点击猫咪，查看 4 次工作状态气泡。</span>
          </button>
        </div>
      </div>
    </div>

    <div class="hud" id="hud">
      <div class="counter" id="counter">第 1 / 4 轮互动</div>
      <div class="prompt" id="prompt"></div>
    </div>

    <div class="scene" id="scene">
      <button class="food" id="food" aria-label="拖拽虾">
        <span class="food-bob">
          <span class="food-tip">拖这个虾到猫咪</span>
          <svg class="shrimp-svg" viewBox="0 0 94 72" aria-hidden="true">
            <defs>
              <linearGradient id="shrimpBody" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffd28b" />
                <stop offset="45%" stop-color="#ffb156" />
                <stop offset="100%" stop-color="#e9852a" />
              </linearGradient>
              <linearGradient id="shrimpTail" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff9f4f" />
                <stop offset="100%" stop-color="#d46d1e" />
              </linearGradient>
            </defs>
            <ellipse cx="40" cy="36" rx="26" ry="18" fill="url(#shrimpBody)" stroke="rgba(255,255,255,0.22)" stroke-width="2" />
            <path d="M60 24 C74 18, 82 23, 86 34 C82 45, 74 50, 60 46 Z" fill="url(#shrimpTail)" />
            <path d="M63 26 L84 18 L78 33 Z" fill="#f08f3a" />
            <path d="M63 44 L84 52 L78 37 Z" fill="#cc6819" />
            <path d="M15 31 C26 22, 37 20, 49 23" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="3" stroke-linecap="round" />
            <path d="M14 40 C26 32, 37 31, 49 35" fill="none" stroke="rgba(255,255,255,0.24)" stroke-width="3" stroke-linecap="round" />
            <circle cx="24" cy="30" r="2.4" fill="#40352c" />
            <circle cx="20" cy="30" r="2.4" fill="#40352c" />
            <path d="M15 29 C10 21, 8 16, 6 11" fill="none" stroke="#b97a3d" stroke-width="2" stroke-linecap="round" />
            <path d="M13 31 C7 29, 3 29, 0 27" fill="none" stroke="#b97a3d" stroke-width="2" stroke-linecap="round" />
            <path d="M15 33 C10 37, 8 41, 6 46" fill="none" stroke="#b97a3d" stroke-width="2" stroke-linecap="round" />
          </svg>
        </span>
      </button>

      <div class="pet-zone" id="petZone">
        <div class="bubble" id="bubble"></div>
        <div class="pet-shell" id="petShell">
          <div class="sprite" id="sprite"></div>
        </div>
        <button class="pet-button" id="petButton" aria-label="点击宠物"></button>
        <div class="pet-hit" id="petHit" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
